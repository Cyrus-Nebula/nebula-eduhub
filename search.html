<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>资料检索 - 个人学习资料归档库</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>个人学习资料归档库</h1>
        <nav>
            <a href="index.html">首页</a>
            <a href="search.html">资料检索</a>
            <a href="tools.html">下载工具</a>
            <a href="packages.html">网校通服务(附带)</a>
            <a href="about.html">关于本站</a>
        </nav>
    </header>

    <div class="container">
        <main>
            <div class="filter-bar">
                <h3>筛选条件</h3>
                <select id="grade">
                    <option value="">全部年级</option>
                    <option>七年级</option>
                    <option>八年级</option>
                    <option>九年级</option>
                    <option>中考</option>
                </select>
                <select id="subject">
                    <option value="">全部学科</option>
                    <option>语文</option>
                    <option>数学</option>
                    <option>英语</option>
                    <option>物理</option>
                    <option>化学</option>
                </select>
                <select id="type">
                    <option value="">全部类型</option>
                    <option>试卷</option>
                    <option>课件</option>
                    <option>教案</option>
                    <option>讲义</option>
                </select>
                <button onclick="filterList()">筛选</button>
            </div>

            <div class="result-list">
                <h3>资料索引列表</h3>
                <div class="item">
                    <h4>九年级数学 二次函数专题卷</h4>
                    <div class="tags">
                        <span>九年级</span><span>数学</span><span>试卷</span>
                    </div>
                    <p>备注：单元复习练习，适合刷题</p>
                </div>
                <div class="item">
                    <h4>八年级物理 压强课件PPT</h4>
                    <div class="tags">
                        <span>八年级</span><span>物理</span><span>课件</span>
                    </div>
                    <p>备注：课堂教学使用</p>
                </div>
                <div class="item">
                    <h4>中考语文文言文复习讲义</h4>
                    <div class="tags">
                        <span>中考</span><span>语文</span><span>讲义</span>
                    </div>
                    <p>备注：知识点汇总</p>
                </div>
                <p class="tip">> 你可以不断复制item块，添加自己收集的资料索引。</p>
            </div>
        </main>

        <aside>
            <div class="side-box">
                <h4>附带业务：学科网网校通</h4>
                <p>本站主要用于个人资料整理，网校通为副业顺带服务。</p>
                <p><a href="packages.html">查看套餐详情 →</a></p>
                <hr>
                <h4>联系</h4>
                <p>微信：xueku2024</p>
            </div>
        </aside>
    </div>

    <footer>
        <p>本站为个人资料归档站点，仅做索引整理，不对外分发版权资源。</p>
    </footer>
    <script src="js/main.js"></script>
</body>
</html>
