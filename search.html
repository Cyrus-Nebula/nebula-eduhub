// 渲染小红书笔记
function renderXhsNotes(filter = "") {
    const container = document.getElementById("xhsContainer");
    const keyword = filter.toLowerCase().trim();
    let html = "";
    const filtered = xhsNotes.filter(n => 
        !keyword || n.title.toLowerCase().includes(keyword) || n.desc.toLowerCase().includes(keyword)
    );
    filtered.forEach(n => {
        const desc = n.desc ? n.desc.substring(0, 60) + (n.desc.length > 60 ? "..." : "") : "点击查看小红书笔记详情";
        html += `
        <div class="material-card">
            <div class="material-icon" style="background:#fce7f3;">📕</div>
            <div class="material-info">
                <div class="material-name">${n.title}</div>
                <div class="material-meta">${desc}</div>
            </div>
            <div class="material-actions">
                <a href="${n.url}" target="_blank" class="material-btn btn-preview">预览</a>
                <a href="${n.url}" target="_blank" class="material-btn btn-download">获取</a>
            </div>
        </div>`;
    });
    if (!html && keyword) {
        html = `<div style="grid-column:1/-1;text-align:center;padding:20px;color:var(--text-muted);">没有找到匹配的笔记</div>`;
    }
    container.innerHTML = html;
}

function renderMaterials(filter = "") {
    const container = document.getElementById("materialsContainer");
    const keyword = filter.toLowerCase().trim();
    let html = "";

    categoryOrder.forEach(cat => {
        const items = materials.filter(m => m.category === cat &&
            (!keyword || m.name.toLowerCase().includes(keyword) || m.category.toLowerCase().includes(keyword)));
        if (items.length === 0) return;

        html += `<div class="category-section">`;
        html += `<div class="category-title">${categoryIcons[cat] || "📁"} ${cat}<span class="count">${items.length}份</span></div>`;
        html += `<div class="material-grid">`;

        items.forEach(m => {
            const filePath = `materials/${m.category}/${m.file}`;
            const encodedPath = encodeURIComponent(filePath).replace(/%2F/g, '/');
            html += `
            const isXhsDup = m.name === "2026年陕西省中考数学试题";
            const xhsBtn = isXhsDup ? `<a href="https://xhslink.cn/o/3DAHQDqtNqr" target="_blank" class="material-btn btn-preview" style="background:#fce7f3;color:#be185d;">小红书</a>` : "";
            html += `
            <div class="material-card">
                <div class="material-icon">${m.icon}</div>
                <div class="material-info">
                    <div class="material-name">${m.name}</div>
                    <div class="material-meta">${m.size || ""}${isXhsDup ? ' · 小红书同步更新' : ''}</div>
                </div>
                <div class="material-actions">
                    ${xhsBtn}
                    <a href="${encodedPath}" target="_blank" class="material-btn btn-preview">预览</a>
                    <a href="${encodedPath}" download class="material-btn btn-download">下载</a>
                </div>
            </div>`;
        });

        html += `</div></div>`;
    });

    if (!html) {
        html = `<div style="text-align:center;padding:40px;color:var(--text-muted);">没有找到匹配的资料</div>`;
    }
    container.innerHTML = html;
}

function filterMaterials() {
    const kw = document.getElementById("materialSearch").value;
    renderXhsNotes(kw);
    renderMaterials(kw);
}

renderXhsNotes();
renderMaterials();
</script>
